dataset:
  name: jorgeortizfuentes/chilean-spanish-corpus
  split: train
  streaming: true

model:
  name: Qwen/Qwen3-0.6B-Base

seed: 42

training_corpus:
  target_tokens: 300000000

  mixture:
    mc4: 0.45
    twitter: 0.35
    news: 0.19
    complaints: 0.01

pilot:
  max_train_tokens: 12000000
  max_runtime_minutes: 105

training:
  sequence_length: 1024

  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8

  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine

  optimizer: adamw_bnb_8bit

  gradient_checkpointing: true

  bf16: true

smoke_test:
  target_tokens: 262144

sources:
  mc4:
    estimated_tokens_per_document: 834.983693

  twitter:
    estimated_tokens_per_document: 27.057896

  news:
    estimated_tokens_per_document: 472.250530

  complaints:
    estimated_tokens_per_document: 140.337007

evaluation:
  blocks_per_source: 64